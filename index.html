<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Americano Coffee Menu</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ГЛУБОКИЙ ТЕМНЫЙ ФОН И БЕЖЕВОЕ СВЕЧЕНИЕ --- */
        body {
            background-color: #12100e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(226, 168, 114, 0.22) 0%, rgba(18, 16, 14, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -80px;
            right: -80px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(190, 130, 80, 0.15) 0%, rgba(18, 16, 14, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        /* --- ШАПКА --- */
        .header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 4px;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #e2a872;
            text-shadow: 0 0 15px rgba(226, 168, 114, 0.3);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: #a09a95;
            letter-spacing: 0.5px;
        }

        /* --- КАРТА ЛОЯЛЬНОСТИ --- */
        .card {
            background: rgba(35, 30, 26, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 168, 114, 0.25);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #f1e5d8;
            margin-bottom: 16px;
        }

        .stamps-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .stamp {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px dashed rgba(226, 168, 114, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(18, 16, 14, 0.6);
            transition: all 0.3s ease;
        }

        .stamp.active {
            border: 2px solid #e2a872;
            background: radial-gradient(circle, #523b28 0%, #291c13 100%);
            box-shadow: 0 0 12px rgba(226, 168, 114, 0.4);
            transform: scale(1.05);
        }

        .progress-text {
            font-size: 13px;
            color: #c5bbb0;
        }

        /* --- КАТЕГОРИИ --- */
        .section-header {
            font-size: 18px;
            font-weight: 700;
            color: #f1e5d8;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .category-card {
            position: relative;
            height: 125px;
            border-radius: 18px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(226, 168, 114, 0.2);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            align-items: flex-end;
        }

        .category-card:active {
            transform: scale(0.95);
            border-color: #e2a872;
        }

        .category-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(18, 16, 14, 0.88) 100%);
        }

        .category-title {
            position: relative;
            z-index: 2;
            padding: 12px 14px;
            font-weight: 700;
            font-size: 15px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- ЭКРАН НАПИТКОВ --- */
        #drinksView {
            display: none;
        }

        .back-btn {
            background: rgba(226, 168, 114, 0.15);
            border: 1px solid rgba(226, 168, 114, 0.4);
            color: #e2a872;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drink-item {
            background: rgba(35, 30, 26, 0.7);
            border: 1px solid rgba(226, 168, 114, 0.15);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .drink-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drink-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .drink-price {
            font-size: 15px;
            font-weight: 700;
            color: #e2a872;
        }

        .drink-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .add-btn {
            background: #e2a872;
            color: #12100e;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .add-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <div class="title">☕ AMERICANO</div>
            <div class="subtitle">3 филиала • Каждый 7-й кофе бесплатно</div>
        </div>

        <!-- Карта лояльности -->
        <div class="card">
            <div class="card-title">Ваша карта лояльности</div>
            <div class="stamps-container" id="stampsBox">
                <div class="stamp" id="s1">⚪</div>
                <div class="stamp" id="s2">⚪</div>
                <div class="stamp" id="s3">⚪</div>
                <div class="stamp" id="s4">⚪</div>
                <div class="stamp" id="s5">⚪</div>
                <div class="stamp" id="s6">⚪</div>
            </div>
            <div class="progress-text" id="progressText">Загрузка данных карты...</div>
        </div>

        <!-- ЭКРАН 1: КАТЕГОРИИ -->
        <div id="categoriesView">
            <div class="section-header">📁 Выберите категорию</div>
            
            <div class="categories-grid">
                <div class="category-card" onclick="openCategory('hot')" style="background-image: url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=400&auto=format&fit=crop');">
                    <div class="category-overlay"></div>
                    <div class="category-title">🔥 Горячие напитки</div>
                </div>

                <div class="category-card" onclick="openCategory('cold')" style="background-image: url('https://images.unsplash.com/photo-1517701604599-bb29b565090c?q=80&w=400&auto=format&fit=crop');">
                    <div class="category-overlay"></div>
                    <div class="category-title">🧊 Холодные напитки</div>
                </div>

                <div class="category-card" onclick="openCategory('smoothies')" style="background-image: url('https://images.unsplash.com/photo-1551024709-8f23befc6f87?q=80&w=400&auto=format&fit=crop');">
                    <div class="category-overlay"></div>
                    <div class="category-title">🍹 Лимонады & Смузи</div>
                </div>

                <div class="category-card" onclick="openCategory('bakery')" style="background-image: url('https://images.unsplash.com/photo-1555507036-ab1f4038808a?q=80&w=400&auto=format&fit=crop');">
                    <div class="category-overlay"></div>
                    <div class="category-title">🥐 Десерты & Выпечка</div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН 2: СПИСОК НАПИТКОВ -->
        <div id="drinksView">
            <button class="back-btn" onclick="showCategories()">← К категориям</button>
            <div class="section-header" id="categoryTitle">🔥 Горячие напитки</div>
            
            <div class="menu-list" id="drinksList">
                <!-- Напитки будут подгружаться динамически -->
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // База данных напитков по категориям
        const MENU = {
            hot: {
                title: '🔥 Горячие напитки',
                items: [
                    { name: 'Эспрессо', price: 15000, size: '0.2 л' },
                    { name: 'Американо', price: 18000, size: '0.3 л' },
                    { name: 'Капучино', price: 22000, size: '0.3 л' },
                    { name: 'Латте', price: 24000, size: '0.3 л' },
                    { name: 'Фирменный Раф', price: 28000, size: '0.3 л' }
                ]
            },
            cold: {
                title: '🧊 Холодные напитки',
                items: [
                    { name: 'Айс Айс Латте', price: 26000, size: '0.4 л' },
                    { name: 'Айс Американо', price: 20000, size: '0.4 л' },
                    { name: 'Бамбл Кофе', price: 30000, size: '0.4 л' },
                    { name: 'Эспрессо Тоник', price: 28000, size: '0.4 л' }
                ]
            },
            smoothies: {
                title: '🍹 Лимонады & Смузи',
                items: [
                    { name: 'Лимонад Классический', price: 22000, size: '0.4 л' },
                    { name: 'Лимонад Маракуйя-Яблоко', price: 25000, size: '0.4 л' },
                    { name: 'Смузи Клубника-Банан', price: 28000, size: '0.4 л' }
                ]
            },
            bakery: {
                title: '🥐 Десерты & Выпечка',
                items: [
                    { name: 'Круассан классический', price: 15000, size: '1 шт' },
                    { name: 'Чизкейк Нью-Йорк', price: 28000, size: '1 шт' },
                    { name: 'Печенье Кукис', price: 12000, size: '1 шт' }
                ]
            }
        };

        let cart = [];

        // Карта лояльности
        const urlParams = new URLSearchParams(window.location.search);
        const stamps = parseInt(urlParams.get('stamps')) || 0;

        for (let i = 1; i <= 6; i++) {
            const stampEl = document.getElementById(`s${i}`);
            if (i <= stamps) {
                stampEl.classList.add('active');
                stampEl.innerText = '☕';
            } else {
                stampEl.classList.remove('active');
                stampEl.innerText = '⚪';
            }
        }

        const progressEl = document.getElementById('progressText');
        if (stamps >= 6) {
            progressEl.innerHTML = '🎁 <b>У вас есть бесплатный напиток!</b>';
        } else {
            progressEl.innerHTML = `Куплено <b>${stamps} из 6</b> кофе для получения подарка 🎁`;
        }

        // Логика навигации
        function openCategory(key) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            const categoryData = MENU[key];
            document.getElementById('categoryTitle').innerText = categoryData.title;

            const drinksList = document.getElementById('drinksList');
            drinksList.innerHTML = '';

            categoryData.items.forEach((item, index) => {
                const drinkEl = document.createElement('div');
                drinkEl.className = 'drink-item';
                drinkEl.innerHTML = `
                    <div class="drink-header">
                        <div class="drink-name">${item.name}</div>
                        <div class="drink-price">${item.price.toLocaleString('ru-RU')} сум</div>
                    </div>
                    <div class="drink-controls">
                        <span style="font-size: 12px; color: #aaa;">Объем: ${item.size}</span>
                        <button class="add-btn" onclick="addToCart('${item.name}', ${item.price}, '${item.size}')">+ В корзину</button>
                    </div>
                `;
                drinksList.appendChild(drinkEl);
            });

            document.getElementById('categoriesView').style.display = 'none';
            document.getElementById('drinksView').style.display = 'block';

            // Включаем системную кнопку "Назад" в Telegram
            tg.BackButton.show();
            tg.BackButton.onClick(showCategories);
        }

        function showCategories() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            document.getElementById('drinksView').style.display = 'none';
            document.getElementById('categoriesView').style.display = 'block';
            tg.BackButton.hide();
        }

        // Корзина и отправка заказа
        function addToCart(name, price, size) {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            const existing = cart.find(i => i.name === name && i.size === size);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ name, price, size, qty: 1 });
            }

            updateMainButton();
        }

        function updateMainButton() {
            if (cart.length === 0) {
                tg.MainButton.hide();
                return;
            }

            const totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);

            tg.MainButton.setText(`Заказать (${totalCount}) • ${totalSum.toLocaleString('ru-RU')} сум`);
            tg.MainButton.show();
        }

        tg.MainButton.onClick(() => {
            if (cart.length === 0) return;
            tg.sendData(JSON.stringify({
                type: 'order',
                cart: cart
            }));
        });
    </script>
</body>
</html>
