<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Americano Special Bar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0c0a;
    --surface:#1c1713;
    --surface-2:#241d18;
    --surface-3:#2b2219;
    --gold:#e6b87d;
    --gold-deep:#c99456;
    --gold-soft:rgba(230,184,125,0.14);
    --text:#f3e9dd;
    --text-muted:#a8988a;
    --line:rgba(230,184,125,0.16);
    --shadow:0 10px 30px rgba(0,0,0,0.45);
    --radius:18px;
    --hero-image:url("photo_2026-07-22_06-45-40_2.jpg");
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 700px 420px at 15% -8%, rgba(230,184,125,0.10), transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 0%, rgba(201,148,86,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit;}
  a{color:inherit;}

  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px;}

  /* HEADER */
  .brand{
    display:flex;align-items:center;gap:12px;
    padding:6px 2px 18px;
  }
  .brand-mark{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(155deg,var(--gold) 0%,var(--gold-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;flex:0 0 auto;
    box-shadow:0 6px 16px rgba(201,148,86,0.35);
  }
  .brand-text h1{font-size:19px;margin:0;line-height:1.15;color:var(--text);}
  .brand-text p{margin:2px 0 0;font-size:12px;color:var(--text-muted);letter-spacing:0.04em;text-transform:uppercase;}

  /* LOYALTY CARD */
  .loyalty{
    position:relative;
    border-radius:22px;
    padding:20px 18px 18px;
    background:
      repeating-linear-gradient(115deg, rgba(230,184,125,0.05) 0px, rgba(230,184,125,0.05) 1px, transparent 1px, transparent 14px),
      linear-gradient(160deg,#221b15 0%, #150f0b 100%);
    border:1px solid var(--line);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
    overflow:hidden;
    margin-bottom:22px;
  }
  .loyalty::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle, rgba(230,184,125,0.18), transparent 70%);
  }
  .loyalty-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .loyalty-title{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold);font-weight:700;}
  .loyalty-sub{font-size:12.5px;color:var(--text-muted);margin-top:4px;max-width:230px;line-height:1.4;}
  .loyalty-count{font-family:'Fraunces',serif;font-size:26px;color:var(--gold);font-weight:600;text-align:right;}
  .loyalty-count span{font-size:13px;color:var(--text-muted);font-family:'Manrope',sans-serif;}

  .stamps{display:flex;gap:9px;margin-top:16px;position:relative;z-index:1;}
  .stamp{
    flex:1;
    aspect-ratio:1/1;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    border:1.5px dashed rgba(230,184,125,0.35);
    background:rgba(255,255,255,0.02);
    color:transparent;
    transition:transform .25s ease;
  }
  .stamp.filled{
    border:1.5px solid var(--gold);
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    color:#1c1713;
    box-shadow:0 4px 10px rgba(201,148,86,0.4);
  }
  .loyalty-note{
    margin-top:14px;font-size:12px;color:var(--text-muted);position:relative;z-index:1;
  }
  .loyalty-note b{color:var(--gold);font-weight:700;}

  /* CATEGORY GRID */
  .section-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.12em;
    color:var(--text-muted);font-weight:700;margin:0 0 10px 2px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .cat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:0;
    display:flex;flex-direction:column;
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    text-align:left;
  }
  .cat-card:active{transform:scale(0.97);background:var(--surface-2);}
  .cat-media{
    position:relative;
    width:100%;height:104px;
    background:radial-gradient(circle at 35% 28%, #2a2119 0%, #150f0b 72%);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .cat-media img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;
  }
  .cat-media-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,12,10,0) 38%, rgba(28,23,19,0.92) 100%);
  }
  .cat-body{padding:12px 14px 14px;}
  .cat-name{font-size:13.5px;font-weight:700;line-height:1.25;color:var(--text);}

  /* HERO BACKGROUND */
  .hero-bg{
    position:fixed;inset:0;
    background-image:var(--hero-image);
    background-size:cover;
    background-position:center 18%;
    filter:blur(26px) saturate(1.08) brightness(0.55);
    transform:scale(1.18);
    z-index:-2;
  }
  .hero-overlay{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 520px 380px at 50% -4%, rgba(230,184,125,0.14), transparent 62%),
      linear-gradient(180deg, rgba(15,12,10,0.30) 0%, rgba(15,12,10,0.72) 42%, var(--bg) 76%);
    z-index:-1;
  }

  .brand-avatar{
    width:50px;height:50px;border-radius:50%;
    object-fit:cover;flex:0 0 auto;
    border:1.5px solid var(--gold);
    box-shadow:0 6px 16px rgba(201,148,86,0.35), 0 0 0 4px rgba(230,184,125,0.07);
    background-color: #2a2119;
  }
</style>
</head>
<body>

<div class="hero-bg" id="heroBg"></div>
<div class="hero-overlay"></div>

<div class="wrap">
  <div class="brand">
    <img class="brand-avatar" id="brandAvatar" alt="Americano">
    <div class="brand-text">
      <h1>Americano Special Bar</h1>
      <p>Кофе • Чай • Бары</p>
    </div>
  </div>

  <div class="loyalty" id="loyaltyCard">
    <div class="loyalty-top">
      <div>
        <div class="loyalty-title">Карта лояльности</div>
        <div class="loyalty-sub">Собирайте штампы за каждый напиток</div>
      </div>
      <div class="loyalty-count" id="loyaltyCount">0<span>/7</span></div>
    </div>
    <div class="stamps" id="stampsRow"></div>
    <div class="loyalty-note" id="loyaltyNote"></div>
  </div>

  <div class="view active" id="viewCategories">
    <div class="section-label">Категории меню</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch(e) {}
  }

  // Твой логотип возвращен на место
  document.getElementById("brandAvatar").src = "photo_2026-07-22_06-45-40_2.jpg";

  // Твои разделы без отсебятины
  var CATEGORIES = [
    { id: 'classic', name: 'Классический кофе', image: 'IMG_7748.PNG' },
    { id: 'ice_coffee', name: 'Айс кофе', image: 'IMG_7749.jpg' },
    { id: 'lemonade', name: 'Лимонады и мохито', image: 'IMG_7750.PNG' },
    { id: 'icetea_matcha', name: 'Айс ти и матча', image: 'IMG_7752.PNG' },
    { id: 'bubble_tea', name: 'Бабл ти', image: 'IMG_7753.PNG' },
    { id: 'detox', name: 'Детокс', image: 'IMG_7754.PNG' },
    { id: 'milkshake', name: 'Милкшейк', image: 'IMG_7755.jpg' },
    { id: 'fresh', name: 'Фреш', image: 'IMG_7756.jpg' }
  ];

  // Идеальная логика лояльности
  function renderLoyalty() {
      let searchParams;
      try {
          const fullUrl = window.location.href.replace('#', '&');
          searchParams = new URL(fullUrl).searchParams;
      } catch (e) {
          searchParams = new URLSearchParams(window.location.search || window.location.hash.replace('#', '?'));
      }
      
      let stamps = parseInt(searchParams.get('stamps'));
      if (isNaN(stamps)) stamps = 0; 
      
      let free = parseInt(searchParams.get('free'));
      if (isNaN(free)) free = 0;

      const TARGET = 7;
      
      document.getElementById('loyaltyCount').innerHTML = `${stamps}<span>/${TARGET}</span>`;
      
      let stampsHtml = '';
      for (let i = 1; i <= TARGET; i++) {
          if (i <= stamps) {
              stampsHtml += `<div class="stamp filled">☕</div>`;
          } else {
              stampsHtml += `<div class="stamp"></div>`;
          }
      }
      document.getElementById('stampsRow').innerHTML = stampsHtml;
      
      if (free > 0) {
          document.getElementById('loyaltyNote').innerHTML = `У вас есть бесплатный напиток! 🎁<br>Покажите карту бариста.`;
      } else {
          let left = TARGET - stamps;
          document.getElementById('loyaltyNote').innerHTML = `До бесплатного напитка осталось <b>${left}</b> штамп(ов).`;
      }
  }

  // Отрисовка твоих категорий
  function renderCategories() {
    const grid = document.getElementById('catGrid');
    if(!grid) return;
    grid.innerHTML = CATEGORIES.map(cat => `
      <div class="cat-card">
        <div class="cat-media">
          <img src="${cat.image}" alt="${cat.name}">
          <div class="cat-media-overlay"></div>
        </div>
        <div class="cat-body">
          <div class="cat-name">${cat.name}</div>
        </div>
      </div>
    `).join('');
  }

  renderLoyalty();
  renderCategories();
})();
</script>
</body>
</html>
