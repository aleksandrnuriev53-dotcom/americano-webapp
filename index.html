<style>
  :root{
    --bg:#0f0c0a;
    --surface:#1c1713;
    --surface-2:#241d18;
    --surface-3:#2b2219;
    --gold:#e6b87d;
    --gold-deep:#c99456;
    --gold-soft:rgba(230,184,125,0.14);
    --text:#f3e9dd;
    --text-muted:#a8988a;
    --line:rgba(230,184,125,0.16);
    --shadow:0 10px 30px rgba(0,0,0,0.45);
    --radius:18px;
    --hero-image:url("IMG_7748.PNG"); /* Фоновая картинка */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 700px 420px at 15% -8%, rgba(230,184,125,0.10), transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 0%, rgba(201,148,86,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit;}
  a{color:inherit;}

  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px;}

  /* HEADER */
  .brand{
    display:flex;align-items:center;gap:12px;
    padding:6px 2px 18px;
  }
  .brand-mark{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(155deg,var(--gold) 0%,var(--gold-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;flex:0 0 auto;
    box-shadow:0 6px 16px rgba(201,148,86,0.35);
  }
  .brand-text h1{font-size:19px;margin:0;line-height:1.15;color:var(--text);}
  .brand-text p{margin:2px 0 0;font-size:12px;color:var(--text-muted);letter-spacing:0.04em;text-transform:uppercase;}

  /* LOYALTY CARD */
  .loyalty{
    position:relative;
    border-radius:22px;
    padding:20px 18px 18px;
    background:
      repeating-linear-gradient(115deg, rgba(230,184,125,0.05) 0px, rgba(230,184,125,0.05) 1px, transparent 1px, transparent 14px),
      linear-gradient(160deg,#221b15 0%, #150f0b 100%);
    border:1px solid var(--line);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
    overflow:hidden;
    margin-bottom:22px;
  }
  .loyalty::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle, rgba(230,184,125,0.18), transparent 70%);
  }
  .loyalty-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .loyalty-title{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold);font-weight:700;}
  .loyalty-sub{font-size:12.5px;color:var(--text-muted);margin-top:4px;max-width:230px;line-height:1.4;}
  .loyalty-count{font-family:'Fraunces',serif;font-size:26px;color:var(--gold);font-weight:600;text-align:right;}
  .loyalty-count span{font-size:13px;color:var(--text-muted);font-family:'Manrope',sans-serif;}

  .stamps{display:flex;gap:9px;margin-top:16px;position:relative;z-index:1;}
  .stamp{
    flex:1;
    aspect-ratio:1/1;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    border:1.5px dashed rgba(230,184,125,0.35);
    background:rgba(255,255,255,0.02);
    color:transparent;
    transition:transform .25s ease;
  }
  .stamp.filled{
    border:1.5px solid var(--gold);
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    color:#1c1713;
    box-shadow:0 4px 10px rgba(201,148,86,0.4);
  }
  .loyalty-note{
    margin-top:14px;font-size:12px;color:var(--text-muted);position:relative;z-index:1;
  }
  .loyalty-note b{color:var(--gold);font-weight:700;}

  /* CATEGORY GRID */
  .section-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.12em;
    color:var(--text-muted);font-weight:700;margin:0 0 10px 2px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .cat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:0;
    display:flex;flex-direction:column;
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    text-align:left;
  }
  .cat-card:active{transform:scale(0.97);background:var(--surface-2);}
  .cat-media{
    position:relative;
    width:100%;height:104px;
    background:radial-gradient(circle at 35% 28%, #2a2119 0%, #150f0b 72%);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .cat-media img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;
  }
  .cat-media-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,12,10,0) 38%, rgba(28,23,19,0.92) 100%);
  }
  .cat-body{padding:12px 14px 14px;}
  .cat-name{font-size:13.5px;font-weight:700;line-height:1.25;color:var(--text);}
  .cat-count{font-size:11px;color:var(--text-muted);margin-top:4px;}

  /* CATEGORY / DRINK VIEW */
  .view{display:none;}
  .view.active{display:block;}
  .cat-header{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
  }
  .back-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--gold);font-size:13px;font-weight:700;
    padding:9px 14px;border-radius:12px;cursor:pointer;
  }
  .back-btn:active{background:var(--surface-2);}
  .cat-header h2{font-size:18px;margin:0;color:var(--text);}

  .drink-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .drink-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .drink-name{font-size:15.5px;font-weight:700;color:var(--text);line-height:1.3;}
  .drink-price{
    font-family:'Fraunces',serif;font-size:17px;color:var(--gold);white-space:nowrap;font-weight:600;
  }

  .vol-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .vol-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text-muted);
    font-size:13px;font-weight:700;
    padding:8px 14px;border-radius:10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .vol-btn.active{
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    border-color:var(--gold);
    color:#1c1713;
  }

  .addon-dropdown{
    position:relative;
    margin-bottom:12px;
    z-index:1;
  }
  .addon-dropdown.open{ z-index:40; }
  .addon-trigger{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;
    padding:11px 12px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    text-align:left;
    transition:border-color .15s ease, background .15s ease;
  }
  .addon-trigger-label{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .addon-trigger .chevron{
    flex:0 0 auto;width:12px;height:8px;color:var(--gold);
    transition:transform .2s ease;
  }
  .addon-dropdown.open .addon-trigger{
    border-color:var(--gold);
    background:var(--surface-3);
  }
  .addon-dropdown.open .addon-trigger .chevron{
    transform:rotate(180deg);
  }
  .addon-panel{
    position:absolute;
    left:0;right:0;top:calc(100% + 6px);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    max-height:260px;
    overflow-y:auto;
    padding:6px;
    display:none;
    -webkit-overflow-scrolling:touch;
  }
  .addon-dropdown.open .addon-panel{ display:block; }
  .addon-option{
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    color:var(--text-muted);
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .addon-option + .addon-option{ margin-top:2px; }
  .addon-option:hover{
    background:var(--gold-soft);
    color:var(--text);
  }
  .addon-option.active{
    background:var(--gold-soft);
    color:var(--gold);
    font-weight:700;
  }

  .add-btn{
    width:100%;
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold);
    font-size:13.5px;font-weight:800;
    padding:11px;border-radius:12px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background .15s ease, color .15s ease;
  }
  .add-btn:active{background:var(--gold);color:#1c1713;}

  /* TOAST */
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);
    background:var(--surface-3);border:1px solid var(--line);
    color:var(--text);font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:30px;
    box-shadow:var(--shadow);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* CART BAR */
  .cart-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg, rgba(15,12,10,0) 0%, rgba(15,12,10,0.97) 22%, #0f0c0a 100%);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    display:none;
    z-index:40;
  }
  .cart-bar.show{display:block;}
  .cart-bar-inner{
    max-width:560px;margin:0 auto;
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    color:#1c1713;
    border-radius:16px;
    padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;
    font-weight:800;font-size:14.5px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(201,148,86,0.35);
  }

  .hero-bg{
    position:fixed;inset:0;
    background-size:cover;
    background-position:center 18%;
    filter:blur(26px) saturate(1.08) brightness(0.55);
    transform:scale(1.18);
    z-index:-2;
  }
  .hero-overlay{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 520px 380px at 50% -4%, rgba(230,184,125,0.14), transparent 62%),
      linear-gradient(180deg, rgba(15,12,10,0.30) 0%, rgba(15,12,10,0.72) 42%, var(--bg) 76%);
    z-index:-1;
  }

  .brand-avatar{
    width:50px;height:50px;border-radius:50%;
    object-fit:cover;flex:0 0 auto;
    border:1.5px solid var(--gold);
    box-shadow:0 6px 16px rgba(201,148,86,0.35), 0 0 0 4px rgba(230,184,125,0.07);
    background-color: #2a2119;
  }
</style>
</head>
<body>

<div class="hero-bg" id="heroBg"></div>
<div class="hero-overlay"></div>

<div class="wrap">
  <div class="brand">
    <img class="brand-avatar" id="brandAvatar" src="IMG_7748.PNG" alt="Americano">

    </div>

  <div class="loyalty" id="loyaltyCard">

    <div class="stamps" id="stampsRow"></div>

  <div class="view active" id="viewCategories">

    <div class="cat-grid" id="catGrid"></div>

  <div class="view" id="viewDrinks">
    <div class="cat-header">
      <button class="back-btn" type="button" onclick="goToCategories()">← Назад</button>
      <h2 id="drinksTitle"></h2>
    </div>
    <div id="drinksList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="cart-bar" id="cartBar">
  <div class="cart-bar-inner" onclick="sendOrder()">
    <span id="cartBarText">Заказать (0) • 0 сум</span>
    <span>→</span>

  // ИСПРАВЛЕНИЕ ЛОЯЛЬНОСТИ: Бронебойное чтение из URL
  function renderLoyalty() {
      // Заменяем хэш на амперсанд, чтобы вытащить параметры, даже если Телеграм их смешал
      let searchParams;
      try {
          const fullUrl = window.location.href.replace('#', '&');
          searchParams = new URL(fullUrl).searchParams;
      } catch (e) {
          searchParams = new URLSearchParams(window.location.search || window.location.hash.replace('#', '?'));
      }
      
      let stamps = parseInt(searchParams.get('stamps'));
      if (isNaN(stamps)) stamps = 0; // Если не передано - ставим 0
      
      let free = parseInt(searchParams.get('free'));
      if (isNaN(free)) free = 0;

      const TARGET = 7;
      
      // Обновляем счетчик
      document.getElementById('loyaltyCount').innerHTML = `${stamps}<span>/${TARGET}</span>`;
      
      // Рисуем штампы
      let stampsHtml = '';
      for (let i = 1; i <= TARGET; i++) {
          if (i <= stamps) {
              stampsHtml += `<div class="stamp filled">☕</div>`;
          } else {
              stampsHtml += `<div class="stamp"></div>`;
          }
      }
      document.getElementById('stampsRow').innerHTML = stampsHtml;
      
      // Выводим текст
      if (free > 0) {
          document.getElementById('loyaltyNote').innerHTML = `У вас есть бесплатный напиток! 🎁<br><b>Покажите карту бариста.</b> (Доступно: ${free})`;
      } else {
          let left = TARGET - stamps;
          document.getElementById('loyaltyNote').innerHTML = `До бесплатного напитка осталось <b>${left}</b> штамп(ов).`;
      }
  }

  // ОТРИСОВКА КАТЕГОРИЙ
  function renderCategories() {
      const catGrid = document.getElementById('catGrid');
      catGrid.innerHTML = '';
      
      for (let catName in MENU_DATA) {
          let itemsCount = MENU_DATA[catName].length;
          let img = CATEGORY_IMAGES[catName] || "IMG_7748.PNG";
          
          catGrid.innerHTML += `
              <div class="cat-card" onclick="showDrinks('${catName}')">
                  <div class="cat-media">
                      <img src="${img}" alt="${catName}">
                      <div class="cat-media-overlay"></div>
                  </div>
                  <div class="cat-body">
                      <div class="cat-name">${catName}</div>
                      <div class="cat-count">${itemsCount} напитков</div>
                  </div>
              </div>
          `;
      }
  }

  // ПОКАЗАТЬ НАПИТКИ КАТЕГОРИИ
  function showDrinks(catName) {
      currentCategory = catName;
      document.getElementById('viewCategories').classList.remove('active');
      document.getElementById('viewDrinks').classList.add('active');
      document.getElementById('drinksTitle').innerText = catName;
      
      const drinksList = document.getElementById('drinksList');
      drinksList.innerHTML = '';
      
      // Инициализируем массив выбранных опций
      activeSelections = MENU_DATA[catName].map(d => ({
          volume: Object.keys(d.prices)[0],
          milk: 'Обычное',
          syrups: [],
          basePrice: d.prices[Object.keys(d.prices)[0]]
      }));

      MENU_DATA[catName].forEach((drink, index) => {
          let volumes = Object.keys(drink.prices);
          let minPrice = Math.min(...Object.values(drink.prices));
          
          let volBtns = volumes.map((v, i) => 
              `<button class="vol-btn ${i===0?'active':''}" onclick="selectVol(this, ${index}, '${v}')">${v}</button>`
          ).join('');
          
          let milkSection = '';
          const noMilkCats = ["Лимонады", "Айс-Ти", "Детокс", "Бабл-Ти", "Мохито", "Фреш"];
          
          if (!noMilkCats.includes(catName)) {
              milkSection = `
                  <div class="addon-dropdown" id="milkDrop_${index}">
                      <button class="addon-trigger" onclick="toggleDrop('milkDrop_${index}')">
                          <span class="addon-trigger-label" id="milkLbl_${index}">Молоко: Обычное</span>
                          <span class="chevron">▼</span>
                      </button>
                      <div class="addon-panel">
                          <div class="addon-option active" onclick="selectMilk(this, ${index}, 'Обычное')">Обычное</div>
                          <div class="addon-option" onclick="selectMilk(this, ${index}, 'Банановое')">Банановое</div>
                          <div class="addon-option" onclick="selectMilk(this, ${index}, 'Кокосовое')">Кокосовое</div>
                      </div>
                  </div>
              `;
          }
          
          let syrupOptions = SYRUPS.map(s => 
              `<div class="addon-option" onclick="toggleSyrup(this, ${index}, '${s}')">${s} (+5 000)</div>`
          ).join('');
          
          let syrupSection = `
              <div class="addon-dropdown" id="syrupDrop_${index}">
                  <button class="addon-trigger" onclick="toggleDrop('syrupDrop_${index}')">
                      <span class="addon-trigger-label" id="syrupLbl_${index}">Без сиропа</span>
                      <span class="chevron">▼</span>
                  </button>
                  <div class="addon-panel">${syrupOptions}</div>
              </div>
          `;
          
          drinksList.innerHTML += `
              <div class="drink-card">
                  <div class="drink-head">
                      <div class="drink-name">${drink.name}</div>
                      <div class="drink-price" id="price_${index}">${minPrice.toLocaleString('ru-RU')} сум</div>
                  </div>
                  <div class="vol-row">${volBtns}</div>
                  ${milkSection}
                  ${syrupSection}
                  <button class="add-btn" onclick="addToCart(${index})">+ В корзину</button>
              </div>
          `;
      });
  }

  function goToCategories() {
      document.getElementById('viewDrinks').classList.remove('active');
      document.getElementById('viewCategories').classList.add('active');
  }

  // УПРАВЛЕНИЕ ОПЦИЯМИ В КАРТОЧКЕ
  function selectVol(btn, index, vol) {
      let parent = btn.parentElement;
      Array.from(parent.children).forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      
      activeSelections[index].volume = vol;
      activeSelections[index].basePrice = MENU_DATA[currentCategory][index].prices[vol];
      updatePrice(index);
  }

  function toggleDrop(id) {
      let el = document.getElementById(id);
      if (el.classList.contains('open')) {
          el.classList.remove('open');
      } else {
          document.querySelectorAll('.addon-dropdown').forEach(d => d.classList.remove('open'));
          el.classList.add('open');
      }
  }

  function selectMilk(option, index, milk) {
      let parent = option.parentElement;
      Array.from(parent.children).forEach(c => c.classList.remove('active'));
      option.classList.add('active');
      
      activeSelections[index].milk = milk;
      document.getElementById('milkLbl_' + index).innerText = 'Молоко: ' + milk;
      document.getElementById('milkDrop_' + index).classList.remove('open');
  }

  function toggleSyrup(option, index, syrup) {
      if (option.classList.contains('active')) {
          option.classList.remove('active');
          activeSelections[index].syrups = activeSelections[index].syrups.filter(s => s !== syrup);
      } else {
          option.classList.add('active');
          activeSelections[index].syrups.push(syrup);
      }
      
      let lbl = activeSelections[index].syrups.length > 0 ? '+ Сиропы (' + activeSelections[index].syrups.length + ')' : 'Без сиропа';
      document.getElementById('syrupLbl_' + index).innerText = lbl;
      updatePrice(index);
  }

  function updatePrice(index) {
      let price = activeSelections[index].basePrice + (activeSelections[index].syrups.length * 5000);
      document.getElementById('price_' + index).innerText = price.toLocaleString('ru-RU') + ' сум';
  }

  // КОРЗИНА И ОТПРАВКА
  function addToCart(index) {
      let d = MENU_DATA[currentCategory][index];
      let sel = activeSelections[index];
      let finalPrice = sel.basePrice + (sel.syrups.length * 5000);
      
      cart.push({
          name: d.name,
          volume: sel.volume,
          milk: sel.milk,
          syrups: [...sel.syrups],
          price: finalPrice,
          qty: 1
      });
      
      showToast('Добавлено в корзину');
      updateCartBar();
  }

  function updateCartBar() {
      let qty = cart.length;
      cartTotal = cart.reduce((sum, item) => sum + item.price, 0);
      
      let cb = document.getElementById('cartBar');
      if (qty > 0) {
          cb.classList.add('show');
          document.getElementById('cartBarText').innerText = `Заказать (${qty}) • ${cartTotal.toLocaleString('ru-RU')} сум`;
      } else {
          cb.classList.remove('show');
      }
  }

  function sendOrder() {
      if (cart.length === 0) return;
      let orderData = {
          cart: cart,
          total_price: cartTotal,
          branch: "Через Web App" // Или укажи нужный
      };
      tg.sendData(JSON.stringify(orderData));
  }

  function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ЗАПУСК
  window.onload = () => {
      renderLoyalty();
      renderCategories();
  };

</script>
</body>
</html>
