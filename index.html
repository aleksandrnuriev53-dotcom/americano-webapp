<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Americano Special Bar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0c0a;
            --card-bg: #1c1713;
            --card-border: rgba(212, 163, 115, 0.25);
            --accent-gold: #e6b87d;
            --accent-glow: rgba(230, 184, 125, 0.4);
            --text-main: #fefae0;
            --text-muted: #a39587;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 163, 115, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(180, 100, 50, 0.1) 0%, transparent 60%);
            color: var(--text-main);
            padding: 14px;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* LOYALTY CARD */
        .loyalty-card {
            background: #1e1814;
            border: 1px solid rgba(212, 163, 115, 0.3);
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .loyalty-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stamps-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .stamp {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(212, 163, 115, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.3);
        }

        .stamp.active {
            border-color: var(--accent-gold);
            background: linear-gradient(135deg, #e6b87d 0%, #b8860b 100%);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .loyalty-progress {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* CATEGORIES */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .category-card {
            position: relative;
            height: 100px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            cursor: pointer;
        }

        .category-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.65);
        }

        .category-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(15, 12, 10, 0.85) 0%, rgba(15, 12, 10, 0.2) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .category-name {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
        }

        .category-arrow {
            color: var(--accent-gold);
            font-size: 22px;
        }

        /* DRINKS VIEW */
        .back-btn {
            background: rgba(212, 163, 115, 0.15);
            border: 1px solid var(--card-border);
            color: var(--accent-gold);
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .view-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .drink-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .drink-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .drink-name {
            font-size: 16px;
            font-weight: 800;
        }

        .drink-price {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* ПРОСТЫЕ КНОПКИ ОБЪЕМА */
        .size-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.5);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .size-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .size-btn.active {
            background: linear-gradient(135deg, #e6b87d 0%, #c49354 100%);
            color: #0f0c0a;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        .addon-select {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 12px;
            outline: none;
        }

        .add-btn {
            width: 100%;
            background: linear-gradient(135deg, #e6b87d 0%, #b8860b 100%);
            color: #0f0c0a;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
        }

        .add-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-title">☕ AMERICANO</div>
        <div class="brand-subtitle">PREMIUM COFFEE & DRINKS</div>
    </div>

    <!-- КАРТА ЛОЯЛЬНОСТИ -->
    <div class="loyalty-card">
        <div class="loyalty-title">Карта Лояльности</div>
        <div class="stamps-grid">
            <div class="stamp" id="s1">⚪</div>
            <div class="stamp" id="s2">⚪</div>
            <div class="stamp" id="s3">⚪</div>
            <div class="stamp" id="s4">⚪</div>
            <div class="stamp" id="s5">⚪</div>
            <div class="stamp" id="s6">⚪</div>
        </div>
        <div class="loyalty-progress" id="progressText">Куплено <b>0 из 6</b> кофе для получения подарка 🎁</div>
    </div>

    <!-- VIEW 1: CATEGORIES -->
    <div id="categoriesView">
        <div class="categories-grid">
            <div class="category-card" onclick="openCategory('classic')">
                <div class="category-bg" style="background-image: url('https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600&q=80');"></div>
                <div class="category-overlay">
                    <span class="category-name">☕ Классический Кофе</span>
                    <span class="category-arrow">➔</span>
                </div>
            </div>
            <div class="category-card" onclick="openCategory('iced')">
                <div class="category-bg" style="background-image: url('https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=600&q=80');"></div>
                <div class="category-overlay">
                    <span class="category-name">🧊 Айс Кофе & Бамбл</span>
                    <span class="category-arrow">➔</span>
                </div>
            </div>
            <div class="category-card" onclick="openCategory('mojito')">
                <div class="category-bg" style="background-image: url('https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=600&q=80');"></div>
                <div class="category-overlay">
                    <span class="category-name">🍹 Лимонады</span>
                    <span class="category-arrow">➔</span>
                </div>
            </div>
            <div class="category-card" onclick="openCategory('icetea')">
                <div class="category-bg" style="background-image: url('https://images.unsplash.com/photo-1556881286-fc6915169721?w=600&q=80');"></div>
                <div class="category-overlay">
                    <span class="category-name">🍃 Айс-Ти & Матча</span>
                    <span class="category-arrow">➔</span>
                </div>
            </div>
            <div class="category-card" onclick="openCategory('bubble')">
                <div class="category-bg" style="background-image: url('https://images.unsplash.com/photo-1558857563-b371033873b8?w=600&q=80');"></div>
                <div class="category-overlay">
                    <span class="category-name">🧋 Бабл-Ти</span>
                    <span class="category-arrow">➔</span>
                </div>
            </div>
            <div class="category-card" onclick="openCategory('detox')">
                <div class="category-bg" style="background-image: url('https://images.unsplash.com/photo-1610970881699-44a5587cabec?w=600&q=80');"></div>
                <div class="category-overlay">
                    <span class="category-name">🥦 Детокс</span>
                    <span class="category-arrow">➔</span>
                </div>
            </div>
            <div class="category-card" onclick="openCategory('milkshake')">
                <div class="category-bg" style="background-image: url('https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=600&q=80');"></div>
                <div class="category-overlay">
                    <span class="category-name">🥤 Милкшейки</span>
                    <span class="category-arrow">➔</span>
                </div>
            </div>
        </div>
    </div>

    <!-- VIEW 2: DRINKS LIST -->
    <div id="drinksView" style="display: none;">
        <button class="back-btn" onclick="showCategories()">← К категориям</button>
        <div class="view-title" id="categoryTitle">Загрузка...</div>
        <div class="drinks-list" id="drinksList"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SYRUPS_AND_ADDONS = [
            "Без добавки",
            "✨ Сироп: Ванильный (+5k)",
            "✨ Сироп: Кокосовый (+5k)",
            "✨ Сироп: Карамельный (+5k)",
            "✨ Сироп: Соленая карамель (+5k)",
            "✨ Сироп: Лесной орех (+5k)",
            "✨ Сироп: Тоффи (+5k)",
            "✨ Сироп: Шоколадное печенье (+5k)",
            "➕ Топпинг (+5k)",
            "➕ Мята (+5k)",
            "➕ Лимон (+5k)",
            "➕ Мёд (+5k)",
            "➕ Собойница (+5k)"
        ];

        const MENU = {
            classic: {
                title: '☕ Классический Кофе',
                items: [
                    { name: 'Эспрессо', variants: [{ size: '250 мл', price: 20000 }, { size: '350 мл', price: 25000 }] },
                    { name: 'Американо', variants: [{ size: '250 мл', price: 20000 }, { size: '350 мл', price: 25000 }] },
                    { name: 'Капучинно', variants: [{ size: '250 мл', price: 20000 }, { size: '350 мл', price: 25000 }, { size: '450 мл', price: 30000 }] },
                    { name: 'Латте', variants: [{ size: '250 мл', price: 20000 }, { size: '350 мл', price: 25000 }, { size: '450 мл', price: 30000 }] },
                    { name: 'Флет Уайт', variants: [{ size: '350 мл', price: 30000 }] },
                    { name: 'Раф Сливочный', variants: [{ size: '250 мл', price: 25000 }, { size: '350 мл', price: 35000 }, { size: '450 мл', price: 45000 }] }
                ]
            },
            iced: {
                title: '🧊 Айс Кофе & Кофейные Новинки',
                items: [
                    { name: 'Бамбл Помело 🍊', variants: [{ size: '500 мл', price: 30000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Ананас Бамбл 🍍', variants: [{ size: '500 мл', price: 30000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Кокосовый Айс Латте 🥥', variants: [{ size: '500 мл', price: 30000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Айс Кофе Муай Тай 🥊', variants: [{ size: '500 мл', price: 30000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Фраппе Oreo', variants: [{ size: '350 мл', price: 35000 }, { size: '450 мл', price: 45000 }] },
                    { name: 'Фраппе Chocolate', variants: [{ size: '350 мл', price: 35000 }, { size: '450 мл', price: 45000 }] },
                    { name: 'Эспрессо - Тоник', variants: [{ size: '350 мл', price: 35000 }, { size: '450 мл', price: 45000 }] },
                    { name: 'Айс Латте', variants: [{ size: '350 мл', price: 25000 }, { size: '450 мл', price: 35000 }] }
                ]
            },
            mojito: {
                title: '🍹 Лимонады',
                items: [
                    { name: 'Дыня Лайм 🍈', variants: [{ size: '500 мл', price: 25000 }, { size: '700 мл', price: 30000 }] },
                    { name: 'Малина Личи 🌺', variants: [{ size: '500 мл', price: 25000 }, { size: '700 мл', price: 35000 }] },
                    { name: 'Апельсин Лайм 🍊', variants: [{ size: '500 мл', price: 25000 }, { size: '700 мл', price: 35000 }] },
                    { name: 'Помело Лайм 🍋', variants: [{ size: '500 мл', price: 25000 }, { size: '700 мл', price: 35000 }] },
                    { name: 'Манго Маракуйя 🥭', variants: [{ size: '500 мл', price: 30000 }, { size: '700 мл', price: 35000 }] },
                    { name: 'Мохито Классическое', variants: [{ size: '300 мл', price: 20000 }, { size: '500 мл', price: 25000 }, { size: '700 мл', price: 35000 }] }
                ]
            },
            icetea: {
                title: '🍃 Айс-Ти & Матча',
                items: [
                    { name: 'Жасмин Лайм 🌼', variants: [{ size: '500 мл', price: 20000 }, { size: '700 мл', price: 25000 }] },
                    { name: 'Персик Лайм 🍑', variants: [{ size: '500 мл', price: 25000 }, { size: '700 мл', price: 30000 }] },
                    { name: 'Лесные Ягоды 🫐', variants: [{ size: '500 мл', price: 25000 }, { size: '700 мл', price: 30000 }] },
                    { name: 'Манго Маракуйя (Айс-Ти) 🥭', variants: [{ size: '500 мл', price: 25000 }, { size: '700 мл', price: 30000 }] },
                    { name: 'Матча Классическая 🍵', variants: [{ size: '500 мл', price: 35000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Матча Клубника 🍓', variants: [{ size: '500 мл', price: 40000 }, { size: '700 мл', price: 45000 }] },
                    { name: 'Матча Манго 🥭', variants: [{ size: '500 мл', price: 40000 }, { size: '700 мл', price: 45000 }] }
                ]
            },
            bubble: {
                title: '🧋 Бабл-Ти',
                items: [
                    { name: 'Сгущенное Молоко 🥛', variants: [{ size: '500 мл', price: 25000 }, { size: '700 мл', price: 30000 }] },
                    { name: 'Орео Бабл-Ти 🍪', variants: [{ size: '500 мл', price: 35000 }, { size: '700 мл', price: 45000 }] },
                    { name: 'Клубника Бабл-Ти 🍓', variants: [{ size: '500 мл', price: 35000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Черника Бабл-Ти 🫐', variants: [{ size: '500 мл', price: 35000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Ананас Бабл-Ти 🍍', variants: [{ size: '500 мл', price: 35000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Малина Бабл-Ти 🍇', variants: [{ size: '500 мл', price: 35000 }, { size: '700 мл', price: 45000 }] }
                ]
            },
            detox: {
                title: '🥦 Детокс',
                items: [
                    { name: 'Щавель Киви 🥝', variants: [{ size: '500 мл', price: 35000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Яблоко Киви 🍏', variants: [{ size: '500 мл', price: 35000 }, { size: '700 мл', price: 40000 }] },
                    { name: 'Клубника Банан 🍌', variants: [{ size: '500 мл', price: 35000 }, { size: '700 мл', price: 40000 }] }
                ]
            },
            milkshake: {
                title: '🥤 Милкшейки',
                items: [
                    { name: 'Шоколадный', variants: [{ size: '300 мл', price: 20000 }, { size: '500 мл', price: 25000 }, { size: '700 мл', price: 35000 }] },
                    { name: 'Oreo Шейк', variants: [{ size: '300 мл', price: 25000 }, { size: '500 мл', price: 35000 }, { size: '700 мл', price: 45000 }] }
                ]
            }
        };

        let selectedVariants = {};
        let cart = [];

        // ШТАМПЫ ЛОЯЛЬНОСТИ
        const urlParams = new URLSearchParams(window.location.search);
        const stamps = parseInt(urlParams.get('stamps')) || 0;

        for (let i = 1; i <= 6; i++) {
            const stampEl = document.getElementById(`s${i}`);
            if (i <= stamps) {
                stampEl.classList.add('active');
                stampEl.innerText = '☕';
            } else {
                stampEl.classList.remove('active');
                stampEl.innerText = '⚪';
            }
        }

        const progressEl = document.getElementById('progressText');
        if (stamps >= 6) {
            progressEl.innerHTML = '🎁 <b>У вас есть бесплатный напиток!</b>';
        } else {
            progressEl.innerHTML = `Куплено <b>${stamps} из 6</b> кофе для получения подарка 🎁`;
        }

        // ВЫБОР ОБЪЕМА
        function selectSize(catKey, itemIdx, variantIdx, btn) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('selectionChanged');

            // Сохраняем выбранный индекс
            selectedVariants[`${catKey}_${itemIdx}`] = variantIdx;

            // Переключаем подсветку кнопок в этом блоке
            const container = btn.parentElement;
            const buttons = container.querySelectorAll('.size-btn');
            buttons.forEach((b, idx) => {
                if (idx === variantIdx) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });

            // Обновляем цену
            updatePrice(catKey, itemIdx);
        }

        // ОБНОВЛЕНИЕ ЦЕНЫ
        function updatePrice(catKey, itemIdx) {
            const item = MENU[catKey].items[itemIdx];
            const priceEl = document.getElementById(`price_${catKey}_${itemIdx}`);
            
            const variantIdx = selectedVariants[`${catKey}_${itemIdx}`] !== undefined ? selectedVariants[`${catKey}_${itemIdx}`] : 0;
            const basePrice = item.variants[variantIdx].price;

            const addonSelect = document.getElementById(`addon_${catKey}_${itemIdx}`);
            const selectedAddon = addonSelect ? addonSelect.value : "Без добавки";
            
            let totalPrice = basePrice;
            if (selectedAddon !== "Без добавки") {
                totalPrice += 5000;
            }

            if (priceEl) {
                priceEl.innerText = `${totalPrice.toLocaleString('ru-RU')} сум`;
            }
        }

        function openCategory(key) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            const categoryData = MENU[key];
            document.getElementById('categoryTitle').innerText = categoryData.title;

            const drinksList = document.getElementById('drinksList');
            drinksList.innerHTML = '';

            categoryData.items.forEach((item, itemIdx) => {
                selectedVariants[`${key}_${itemIdx}`] = 0; // По умолчанию всегда 1-й объем

                const drinkEl = document.createElement('div');
                drinkEl.className = 'drink-item';

                const optionsHtml = SYRUPS_AND_ADDONS.map(addon => `<option value="${addon}">${addon}</option>`).join('');

                let sizesHtml = '';
                if (item.variants.length > 1) {
                    sizesHtml = `<div class="size-selector">` + 
                        item.variants.map((v, vIdx) => `
                            <button type="button" 
                                    class="size-btn ${vIdx === 0 ? 'active' : ''}" 
                                    onclick="selectSize('${key}', ${itemIdx}, ${vIdx}, this)">
                                ${v.size}
                            </button>
                        `).join('') + 
                    `</div>`;
                }

                drinkEl.innerHTML = `
                    <div class="drink-header">
                        <div class="drink-name">${item.name}</div>
                        <div class="drink-price" id="price_${key}_${itemIdx}">${item.variants[0].price.toLocaleString('ru-RU')} сум</div>
                    </div>
                    
                    ${sizesHtml}

                    <select class="addon-select" id="addon_${key}_${itemIdx}" onchange="updatePrice('${key}', ${itemIdx})">
                        ${optionsHtml}
                    </select>

                    <button type="button" class="add-btn" onclick="addToCart('${key}', ${itemIdx})">+ Добавить в корзину</button>
                `;
                drinksList.appendChild(drinkEl);
            });

            document.getElementById('categoriesView').style.display = 'none';
            document.getElementById('drinksView').style.display = 'block';

            tg.BackButton.show();
            tg.BackButton.onClick(showCategories);
        }

        function showCategories() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            document.getElementById('drinksView').style.display = 'none';
            document.getElementById('categoriesView').style.display = 'block';
            tg.BackButton.hide();
        }

        function addToCart(catKey, itemIdx) {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            const item = MENU[catKey].items[itemIdx];
            
            const variantIdx = selectedVariants[`${catKey}_${itemIdx}`] !== undefined ? selectedVariants[`${catKey}_${itemIdx}`] : 0;
            const selectedVariant = item.variants[variantIdx];

            const addonSelect = document.getElementById(`addon_${catKey}_${itemIdx}`);
            const selectedAddon = addonSelect ? addonSelect.value : "Без добавки";

            let finalPrice = selectedVariant.price;
            let addonTitle = "";

            if (selectedAddon !== "Без добавки") {
                finalPrice += 5000;
                addonTitle = selectedAddon.replace("✨ ", "").replace("➕ ", "").replace(" (+5k)", "");
            }

            const cartItemName = addonTitle ? `${item.name} (${addonTitle})` : item.name;

            const existing = cart.find(i => i.name === cartItemName && i.size === selectedVariant.size);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    name: cartItemName,
                    price: finalPrice,
                    size: selectedVariant.size,
                    qty: 1
                });
            }

            updateMainButton();
        }

        function updateMainButton() {
            if (cart.length === 0) {
                tg.MainButton.hide();
                return;
            }

            const totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);

            tg.MainButton.setText(`Заказать (${totalCount}) • ${totalSum.toLocaleString('ru-RU')} сум`);
            tg.MainButton.show();
        }

        tg.MainButton.onClick(() => {
            if (cart.length === 0) return;
            tg.sendData(JSON.stringify({
                type: 'order',
                cart: cart
            }));
        });
    </script>
</body>
</html>
