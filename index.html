  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 700px 420px at 15% -8%, rgba(230,184,125,0.10), transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 0%, rgba(201,148,86,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit;}
  a{color:inherit;}

  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px;}

  /* HEADER */
  .brand{
    display:flex;align-items:center;gap:12px;
    padding:6px 2px 18px;
  }
  .brand-mark{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(155deg,var(--gold) 0%,var(--gold-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;flex:0 0 auto;
    box-shadow:0 6px 16px rgba(201,148,86,0.35);
  }
  .brand-text h1{font-size:19px;margin:0;line-height:1.15;color:var(--text);}
  .brand-text p{margin:2px 0 0;font-size:12px;color:var(--text-muted);letter-spacing:0.04em;text-transform:uppercase;}

  /* LOYALTY CARD - signature element */
  .loyalty{
    position:relative;
    border-radius:22px;
    padding:20px 18px 18px;
    background:
      repeating-linear-gradient(115deg, rgba(230,184,125,0.05) 0px, rgba(230,184,125,0.05) 1px, transparent 1px, transparent 14px),
      linear-gradient(160deg,#221b15 0%, #150f0b 100%);
    border:1px solid var(--line);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
    overflow:hidden;
    margin-bottom:22px;
  }
  .loyalty::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle, rgba(230,184,125,0.18), transparent 70%);
  }
  .loyalty-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .loyalty-title{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold);font-weight:700;}
  .loyalty-sub{font-size:12.5px;color:var(--text-muted);margin-top:4px;max-width:230px;line-height:1.4;}
  .loyalty-count{font-family:'Fraunces',serif;font-size:26px;color:var(--gold);font-weight:600;text-align:right;}
  .loyalty-count span{font-size:13px;color:var(--text-muted);font-family:'Manrope',sans-serif;}

  .stamps{display:flex;gap:7px;margin-top:16px;position:relative;z-index:1;}
  .stamp{
    flex:1;
    aspect-ratio:1/1;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    border:1.5px dashed rgba(230,184,125,0.35);
    background:rgba(255,255,255,0.02);
    color:transparent;
    transition:transform .25s ease;
  }
  .stamp.filled{
    border:1.5px solid var(--gold);
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    color:#1c1713;
    box-shadow:0 4px 10px rgba(201,148,86,0.4);
  }
  .loyalty-note{
    margin-top:14px;font-size:12px;color:var(--text-muted);position:relative;z-index:1;
  }
  .loyalty-note b{color:var(--gold);font-weight:700;}

  /* CATEGORY GRID */
  .section-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.12em;
    color:var(--text-muted);font-weight:700;margin:0 0 10px 2px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .cat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:0;
    display:flex;flex-direction:column;
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    text-align:left;
  }
  .cat-card:active{transform:scale(0.97);background:var(--surface-2);}
  .cat-media{
    position:relative;
    width:100%;height:104px;
    background:radial-gradient(circle at 35% 28%, #2a2119 0%, #150f0b 72%);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .cat-media img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;
  }
  .cat-media img.cat-media-bg{
    filter:blur(14px) brightness(0.55) saturate(1.15);
    transform:scale(1.25);
  }
  .cat-media img.cat-media-fg{
    object-fit:contain;
    z-index:1;
  }
  .cat-media-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,12,10,0) 38%, rgba(28,23,19,0.92) 100%);
  }
  .cat-media .cat-badge-icon svg{width:32px;height:32px;position:relative;z-index:1;}
  .cat-body{padding:12px 14px 14px;}
  .cat-icon{font-size:26px;}
  .cat-name{font-size:13.5px;font-weight:700;line-height:1.25;color:var(--text);}
  .cat-count{font-size:11px;color:var(--text-muted);margin-top:4px;}

  /* CATEGORY / DRINK VIEW */
  .view{display:none;}
  .view.active{display:block;}
  .cat-header{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
  }
  .back-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--gold);font-size:13px;font-weight:700;
    padding:9px 14px;border-radius:12px;cursor:pointer;
  }
  .back-btn:active{background:var(--surface-2);}
  .cat-header h2{font-size:18px;margin:0;color:var(--text);}

  .drink-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .drink-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .drink-name{font-size:15.5px;font-weight:700;color:var(--text);line-height:1.3;}
  .drink-price{
    font-family:'Fraunces',serif;font-size:17px;color:var(--gold);white-space:nowrap;font-weight:600;
  }

  .vol-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .vol-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text-muted);
    font-size:13px;font-weight:700;
    padding:8px 14px;border-radius:10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .vol-btn.active{
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    border-color:var(--gold);
    color:#1c1713;
  }

  .addon-dropdown{
    position:relative;
    margin-bottom:12px;
    z-index:1;
  }
  .addon-dropdown.open{ z-index:40; }
  .addon-trigger{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;
    padding:11px 12px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    text-align:left;
    transition:border-color .15s ease, background .15s ease;
  }
  .addon-trigger-label{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .addon-trigger .chevron{
    flex:0 0 auto;width:12px;height:8px;color:var(--gold);
    transition:transform .2s ease;
  }
  .addon-dropdown.open .addon-trigger{
    border-color:var(--gold);
    background:var(--surface-3);
  }
  .addon-dropdown.open .addon-trigger .chevron{
    transform:rotate(180deg);
  }
  .addon-panel{
    position:absolute;
    left:0;right:0;top:calc(100% + 6px);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    max-height:260px;
    overflow-y:auto;
    padding:6px;
    display:none;
    -webkit-overflow-scrolling:touch;
  }
  .addon-dropdown.open .addon-panel{ display:block; }
  .addon-option{
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    color:var(--text-muted);
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .addon-option + .addon-option{ margin-top:2px; }
  .addon-option:hover{
    background:var(--gold-soft);
    color:var(--text);
  }
  .addon-option.active{
    background:var(--gold-soft);
    color:var(--gold);
    font-weight:700;
  }
  .branch-overlay{
    position:fixed;inset:0;
    background:rgba(5,4,3,0.72);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:200;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease;
  }
  .branch-overlay.open{ opacity:1;pointer-events:auto; }
  .branch-sheet{
    width:100%;max-width:480px;
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:24px 24px 0 0;
    box-shadow:var(--shadow);
    padding:22px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .branch-overlay.open .branch-sheet{ transform:translateY(0); }
  .branch-handle{
    width:36px;height:4px;border-radius:3px;
    background:var(--line);
    margin:0 auto 16px;
  }
  .branch-title{
    font-size:16px;font-weight:700;color:var(--text);
    margin-bottom:4px;
  }
  .branch-subtitle{
    font-size:12.5px;color:var(--text-muted);
    margin-bottom:16px;
  }
  .branch-list{ display:flex;flex-direction:column;gap:10px; }
  .branch-option{
    display:flex;align-items:center;gap:12px;
    padding:14px 14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--surface-2);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .branch-option:active{ transform:scale(0.98); }
  .branch-option.selected{
    border-color:var(--gold);
    background:var(--gold-soft);
  }
  .branch-pin{
    flex:0 0 auto;
    width:36px;height:36px;border-radius:50%;
    background:var(--surface-3);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .branch-option.selected .branch-pin{
    border-color:var(--gold);
  }
  .branch-info{ flex:1;min-width:0; }
  .branch-name{ font-size:14px;font-weight:600;color:var(--text); }
  .branch-sub{ font-size:12px;color:var(--text-muted);margin-top:2px; }
  .branch-check{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .branch-option.selected .branch-check{
    border-color:var(--gold);background:var(--gold);
  }
  .branch-check svg{ width:11px;height:11px;opacity:0; }
  .branch-option.selected .branch-check svg{ opacity:1; }
  .branch-confirm{
    width:100%;margin-top:18px;
    background:var(--gold);
    color:#1c1713;
    border:none;border-radius:14px;
    padding:14px;
    font-size:14px;font-weight:700;
    cursor:pointer;
    opacity:0.4;pointer-events:none;
    transition:opacity .15s ease;
  }
  .branch-confirm.ready{ opacity:1;pointer-events:auto; }
  .branch-cancel{
    width:100%;margin-top:8px;
    background:transparent;
    color:var(--text-muted);
    border:none;
    padding:10px;
    font-size:13px;
    cursor:pointer;
  }
  .addon-trigger:focus-visible, .vol-btn:focus-visible, .back-btn:focus-visible, .cat-card:focus-visible, .add-btn:focus-visible, .branch-option:focus-visible, .branch-confirm:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  .add-btn{
    width:100%;
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold);
    font-size:13.5px;font-weight:800;
    padding:11px;border-radius:12px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background .15s ease, color .15s ease;
  }
  .add-btn:active{background:var(--gold);color:#1c1713;}
  .add-btn.just-added{background:var(--gold);color:#1c1713;}

  /* TOAST */
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);
    background:var(--surface-3);border:1px solid var(--line);
    color:var(--text);font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:30px;
    box-shadow:var(--shadow);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* FALLBACK CART BAR (used outside Telegram, or as visual echo) */
  .cart-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg, rgba(15,12,10,0) 0%, rgba(15,12,10,0.97) 22%, #0f0c0a 100%);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    display:none;
    z-index:40;
  }
  .cart-bar.show{display:block;}
  .cart-bar-inner{
    max-width:560px;margin:0 auto;
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    color:#1c1713;
    border-radius:16px;
    padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;
    font-weight:800;font-size:14.5px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(201,148,86,0.35);
  }

  .empty-state{
    text-align:center;color:var(--text-muted);font-size:13px;padding:30px 10px;
  }

  /* HERO BACKGROUND (logo photo, blurred, main-menu backdrop) */
  .hero-bg{
    position:fixed;inset:0;
    background-image:var(--hero-image);
    background-size:cover;
    background-position:center 18%;
    filter:blur(26px) saturate(1.08) brightness(0.55);
    transform:scale(1.18);
    z-index:-2;
  }
  .hero-overlay{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 520px 380px at 50% -4%, rgba(230,184,125,0.14), transparent 62%),
      linear-gradient(180deg, rgba(15,12,10,0.30) 0%, rgba(15,12,10,0.72) 42%, var(--bg) 76%);
    z-index:-1;
  }

  /* BRAND AVATAR (uploaded logo thumbnail) */
  .brand-avatar{
    width:50px;height:50px;border-radius:50%;
    object-fit:cover;flex:0 0 auto;
    border:1.5px solid var(--gold);
    box-shadow:0 6px 16px rgba(201,148,86,0.35), 0 0 0 4px rgba(230,184,125,0.07);
  }

  /* DRINK-VIEW HEADER BADGE (icon or photo thumbnail) */
  .drink-badge{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:radial-gradient(circle at 35% 28%, #2a2119 0%, #150f0b 72%);
    border:1px solid rgba(230,184,125,0.4);
    overflow:hidden;
  }
  .drink-badge svg{width:18px;height:18px;}
  .drink-badge img{width:100%;height:100%;object-fit:cover;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>

<div class="hero-bg" id="heroBg"></div>
<div class="hero-overlay"></div>

<div class="wrap">

  <div class="brand">
    <img class="brand-avatar" id="brandAvatar" alt="Americano Coffee & Food Truck">
    <div class="brand-text">
      <h1>Americano Special Bar</h1>
      <p>Кофе • Чай • Бары</p>
    </div>
  </div>

  <div class="loyalty" id="loyaltyCard">
    <div class="loyalty-top">
      <div>
        <div class="loyalty-title">Карта лояльности</div>
        <div class="loyalty-sub" id="loyaltySub">Собирайте штампы за каждый напиток</div>
      </div>
      <div class="loyalty-count" id="loyaltyCount">0<span>/7</span></div>
    </div>
    <div class="stamps" id="stampsRow"></div>
    <div class="loyalty-note" id="loyaltyNote"></div>
  </div>

  <!-- CATEGORIES VIEW -->
  <div class="view active" id="viewCategories">
    <div class="section-label">Категории меню</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <!-- DRINKS VIEW -->
  <div class="view" id="viewDrinks">
    <div class="cat-header">
      <button class="back-btn" type="button" id="backBtn" onclick="goToCategories()">← К категориям</button>
      <h2 id="drinksTitle"></h2>
    </div>
    <div id="drinksList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="cart-bar" id="cartBar">
  <div class="cart-bar-inner" id="cartBarInner" onclick="requestOrder()">
    <span id="cartBarText">Заказать (0) • 0 сум</span>

  </div>
</div>

<div class="branch-overlay" id="branchOverlay">
  <div class="branch-sheet">
    <div class="branch-handle"></div>

    <div class="branch-list" id="branchList"></div>
    <button class="branch-confirm" id="branchConfirm" type="button" onclick="confirmBranch()">Подтвердить заказ</button>
    <button class="branch-cancel" type="button" onclick="closeBranchModal()">Отмена</button>
  </div>
</div>

  /* =========================================================
     UTILS
  ========================================================= */
  function fmt(n){
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function getUrlStamps(){
    var params = new URLSearchParams(window.location.search);
    var raw = parseInt(params.get("stamps"), 10);
    if (isNaN(raw)) raw = 0;
    if (raw < 0) raw = 0;
    if (raw > 7) raw = 7;
    return raw;
  }

  function getUrlFree(){
    var params = new URLSearchParams(window.location.search);
    var raw = parseInt(params.get("free"), 10);
    if (isNaN(raw) || raw < 0) raw = 0;
    return raw;
  }

  /* =========================================================
     LOYALTY CARD
  ========================================================= */
  function pluralDrinks(n){
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return "напиток";
    if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return "напитка";
    return "напитков";
  }

  function renderLoyalty(){
    var row = document.getElementById("stampsRow");
    var countEl = document.getElementById("loyaltyCount");
    var note = document.getElementById("loyaltyNote");
    if (!row || !countEl || !note) return; // защита: если разметка карты недоступна, просто не рисуем её

    var freeCount = getUrlFree();  // сколько бесплатных напитков накоплено (0, 1, 2...)
    var hasFree = freeCount > 0;
    var stamps = getUrlStamps();   // реальный прогресс текущего круга — не форсируем "полную" карту

    row.innerHTML = "";
    for (var i = 0; i < 7; i++){
      var el = document.createElement("div");
      el.className = "stamp" + (i < stamps ? " filled" : "");
      el.textContent = "☕";
      row.appendChild(el);
    }
    countEl.innerHTML = stamps + "<span>/7</span>";

    var noteHtml = "";
    if (hasFree){
      var giftWord = freeCount === 1 ? "бесплатный напиток" : "бесплатных напитка";
      noteHtml += "<b>У вас есть " + freeCount + " " + giftWord + "!</b> 🎁 Покажите карту бариста.";
    }
    if (stamps >= 7){
      noteHtml += (noteHtml ? "<br>" : "") + "<b>Карта заполнена!</b> 🎉 Ещё один бесплатный напиток уже ждёт вас.";
    } else {
      var left = 7 - stamps;
      var progressLine = "Ещё <b>" + left + "</b> " + pluralDrinks(left) + " до бесплатного угощения ✨";
      noteHtml += (noteHtml ? "<br>" : "") + progressLine;
    }
    note.innerHTML = noteHtml;
  }

  /* =========================================================
     CATEGORY GRID
  ========================================================= */
  function renderCategories(){
    var grid = document.getElementById("catGrid");
    grid.innerHTML = "";
    CATEGORIES.forEach(function(cat){
      var card = document.createElement("button");
      card.type = "button";
      card.className = "cat-card";
      var mediaInner = CATEGORY_IMAGES[cat.id]
        ? '<img src="' + CATEGORY_IMAGES[cat.id] + '" alt="' + cat.name + '" style="object-position:' + (CATEGORY_IMAGE_POS[cat.id] || 'center') + ';">' +
          '<div class="cat-media-overlay"></div>'
        : '<div class="cat-badge-icon">' + (ICONS[cat.id] || '') + '</div>';

      card.innerHTML =
        '<div class="cat-media">' + mediaInner + '</div>' +
        '<div class="cat-body">' +
          '<div class="cat-name">' + cat.icon + ' ' + cat.name + '</div>' +
          '<div class="cat-count">' + cat.drinks.length + ' ' + pluralDrinks(cat.drinks.length) + '</div>' +
        '</div>';
      card.addEventListener("click", function(catId){
        return function(){ openCategory(catId); };
      }(cat.id));
      grid.appendChild(card);
    });
  }

  /* =========================================================
     NAVIGATION
  ========================================================= */
  function openCategory(catId){
    var cat = CATEGORIES.filter(function(c){ return c.id === catId; })[0];
    if (!cat) return;
    currentCategoryId = catId;

    var headerBadgeInner = CATEGORY_IMAGES[cat.id]
      ? '<img src="' + CATEGORY_IMAGES[cat.id] + '" alt="" style="object-position:' + (CATEGORY_IMAGE_POS[cat.id] || 'center') + ';">'
      : (ICONS[cat.id] || '');

    document.getElementById("drinksTitle").innerHTML =
      '<span class="drink-badge" style="display:inline-flex;vertical-align:middle;margin-right:8px;">' + headerBadgeInner + '</span>' +
      cat.icon + ' ' + cat.name;
    renderDrinks(cat);

    document.getElementById("viewCategories").classList.remove("active");
    document.getElementById("viewDrinks").classList.add("active");
    window.scrollTo(0,0);

    if (tg && tg.BackButton){
      tg.BackButton.show();
      tg.BackButton.onClick(goToCategories);
    }
  }

  function goToCategories(){
    currentCategoryId = null;
    document.getElementById("viewDrinks").classList.remove("active");
    document.getElementById("viewCategories").classList.add("active");
    window.scrollTo(0,0);

    if (tg && tg.BackButton){
      tg.BackButton.hide();
      tg.BackButton.offClick(goToCategories);
    }
  }
  window.goToCategories = goToCategories;

  /* =========================================================
     DRINKS LIST + ISOLATED VOLUME / ADDON LOGIC
  ========================================================= */
  function renderDrinks(cat){
    var list = document.getElementById("drinksList");
    list.innerHTML = "";

    cat.drinks.forEach(function(drink, drinkIndex){
      var cardId = cat.id + "-" + drinkIndex;

      var card = document.createElement("div");
      card.className = "drink-card";
      card.setAttribute("data-drink-id", cardId);

      // --- head ---
      var head = document.createElement("div");
      head.className = "drink-head";
      var nameEl = document.createElement("div");
      nameEl.className = "drink-name";
      nameEl.textContent = drink.name;
      var priceEl = document.createElement("div");
      priceEl.className = "drink-price";
      priceEl.textContent = fmt(drink.volumes[0].price) + " сум";
      head.appendChild(nameEl);
      head.appendChild(priceEl);
      card.appendChild(head);

      // --- volume buttons row (isolated per-card) — skipped for single fixed-price drinks ---
      var volRow = null;
      if (!drink.hideVolume){
        volRow = document.createElement("div");
        volRow.className = "vol-row";
        drink.volumes.forEach(function(vol, volIndex){
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "vol-btn" + (volIndex === 0 ? " active" : "");
          btn.textContent = vol.label ? vol.label : (vol.ml + " мл");
          btn.setAttribute("data-price", vol.price);
          volRow.appendChild(btn);
        });
        card.appendChild(volRow);
      }

      // --- addon dropdown (custom-styled, replaces native <select> so the
      //     open state matches the bot's theme instead of the OS picker) ---
      var addonWrap = document.createElement("div");
      addonWrap.className = "addon-dropdown";

      var trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "addon-trigger";
      var triggerLabel = document.createElement("span");
      triggerLabel.className = "addon-trigger-label";
      triggerLabel.textContent = ADDONS[0].label;
      var chevron = document.createElementNS("http://www.w3.org/2000/svg","svg");
      chevron.setAttribute("class","chevron");
      chevron.setAttribute("viewBox","0 0 14 9");
      chevron.setAttribute("fill","none");
      var chevronPath = document.createElementNS("http://www.w3.org/2000/svg","path");
      chevronPath.setAttribute("d","M1 1L7 7L13 1");
      chevronPath.setAttribute("stroke","currentColor");
      chevronPath.setAttribute("stroke-width","1.6");
      chevronPath.setAttribute("stroke-linecap","round");
      chevronPath.setAttribute("stroke-linejoin","round");
      chevron.appendChild(chevronPath);
      trigger.appendChild(triggerLabel);
      trigger.appendChild(chevron);
      addonWrap.appendChild(trigger);

      var panel = document.createElement("div");
      panel.className = "addon-panel";
      var selectedAddonId = "";
      ADDONS.forEach(function(addon, addonIndex){
        var opt = document.createElement("div");
        opt.className = "addon-option" + (addonIndex === 0 ? " active" : "");
        opt.textContent = addon.label;
        opt.setAttribute("data-id", addon.id);
        panel.appendChild(opt);
      });
      addonWrap.appendChild(panel);
      card.appendChild(addonWrap);

      function closeAddonDropdown(){
        addonWrap.classList.remove("open");
      }

      trigger.addEventListener("click", function(e){
        e.stopPropagation();
        var willOpen = !addonWrap.classList.contains("open");
        document.querySelectorAll(".addon-dropdown.open").forEach(function(w){
          w.classList.remove("open");
        });
        if (willOpen) addonWrap.classList.add("open");
      });

      panel.querySelectorAll(".addon-option").forEach(function(opt){
        opt.addEventListener("click", function(e){
          e.stopPropagation();
          panel.querySelectorAll(".addon-option").forEach(function(o){
            o.classList.remove("active");
          });
          opt.classList.add("active");
          selectedAddonId = opt.getAttribute("data-id");
          triggerLabel.textContent = opt.textContent;
          closeAddonDropdown();
          recalcPrice();
        });
      });

      // --- add to cart button ---
      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "add-btn";
      addBtn.innerHTML = "+ Добавить в корзину";
      card.appendChild(addBtn);

      list.appendChild(card);

      /* ---------- ISOLATED EVENT WIRING (scoped strictly to THIS card) ---------- */

      function currentVolBtn(){
        return card.querySelector(".vol-btn.active");
      }

      function currentAddon(){
        return ADDONS.filter(function(a){ return a.id === selectedAddonId; })[0] || ADDONS[0];
      }

      function recalcPrice(){
        var volBtn = currentVolBtn();
        var basePrice = volBtn ? parseInt(volBtn.getAttribute("data-price"), 10) : drink.volumes[0].price;
        var addon = currentAddon();
        var total = basePrice + addon.price;
        priceEl.textContent = fmt(total) + " сум";
        return total;
      }

      // Volume buttons: toggle active strictly within THIS card's vol-row
      if (volRow){
        var volButtons = volRow.querySelectorAll(".vol-btn");
        volButtons.forEach(function(btn){
          btn.addEventListener("click", function(){
            volRow.querySelectorAll(".vol-btn").forEach(function(b){
              b.classList.remove("active");
            });
            btn.classList.add("active");
            recalcPrice();
          });
        });
      }

      // Add to cart
      addBtn.addEventListener("click", function(){
        var volBtn = currentVolBtn();
        var sizeLabel = volBtn ? volBtn.textContent.trim() : (drink.volumes[0].label || (drink.volumes[0].ml + " мл"));
        var addon = currentAddon();
        var total = recalcPrice();

        var itemName = drink.name + (addon.id ? " (" + addon.label.replace(/\s*\(\+5k\)/,"") + ")" : "");
        var size = sizeLabel;
        var key = cardId + "|" + sizeLabel + "|" + addon.id;

        var existing = cart.filter(function(i){ return i.key === key; })[0];
        if (existing){
          existing.qty += 1;
        } else {
          cart.push({
            key: key,
            name: itemName,
            size: size,
            price: total,
            qty: 1
          });
        }

        showToast(drink.name + " добавлен в корзину");
        addBtn.classList.add("just-added");
        addBtn.textContent = "✓ Добавлено";
        setTimeout(function(){
          addBtn.classList.remove("just-added");
          addBtn.innerHTML = "+ Добавить в корзину";
        }, 900);

        updateCartUI();
      });

      // init price
      recalcPrice();
    });
  }

  /* =========================================================
     TOAST
  ========================================================= */
  var toastTimer = null;
  function showToast(msg){
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toast.classList.remove("show");
    }, 1600);
  }

  /* =========================================================
     CART / TELEGRAM MAIN BUTTON
  ========================================================= */
  function cartTotals(){
    var count = 0, sum = 0;
    cart.forEach(function(i){
      count += i.qty;
      sum += i.price * i.qty;
    });
    return { count: count, sum: sum };
  }

  function updateCartUI(){
    var totals = cartTotals();
    var text = "Заказать (" + totals.count + ") • " + fmt(totals.sum) + " сум";

    if (tg && tg.MainButton){
      tg.MainButton.setText(text);
      if (totals.count > 0){
        tg.MainButton.show();
      } else {
        tg.MainButton.hide();
      }
      tg.MainButton.offClick(requestOrder);
      tg.MainButton.onClick(requestOrder);
    }

    // Fallback bottom bar for browsers without Telegram WebApp
    var bar = document.getElementById("cartBar");
    var barText = document.getElementById("cartBarText");
    barText.textContent = text;
    if (!tg && totals.count > 0){
      bar.classList.add("show");
    } else {
      bar.classList.remove("show");
    }
  }

  function sendOrder(branch){
    var totals = cartTotals();
    if (totals.count === 0) return;

    var payload = {
      type: "order",
      branch: branch,
      cart: cart.map(function(i){
        return { name: i.name, size: i.size, price: i.price, qty: i.qty };
      }),
      total_price: totals.sum
    };

    if (tg && tg.sendData){
      tg.sendData(JSON.stringify(payload));
    } else {
      showToast("Заказ отправлен (демо-режим): " + branch);
      console.log("order payload", payload);
    }
  }
  window.sendOrder = sendOrder;

  /* =========================================================
     BRANCH SELECTION MODAL
  ========================================================= */
  var BRANCHES = [
    { name: "Мирсаид Барака 2", sub: "Корзинка" },
    { name: "Абдурахмана Джами 96", sub: "Ёшлар маркази" },
    { name: "Буюк Ипак Йули 1", sub: "Микрорайон" }
  ];
  var selectedBranch = null;

  var branchOverlay = document.getElementById("branchOverlay");
  var branchList = document.getElementById("branchList");
  var branchConfirmBtn = document.getElementById("branchConfirm");

  BRANCHES.forEach(function(b){
    var opt = document.createElement("div");
    opt.className = "branch-option";

    var pin = document.createElement("div");
    pin.className = "branch-pin";
    pin.textContent = "📍";

    var info = document.createElement("div");
    info.className = "branch-info";
    var name = document.createElement("div");
    name.className = "branch-name";
    name.textContent = b.name;
    var sub = document.createElement("div");
    sub.className = "branch-sub";
    sub.textContent = b.sub;
    info.appendChild(name);
    info.appendChild(sub);

    var check = document.createElement("div");
    check.className = "branch-check";
    var checkSvg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    checkSvg.setAttribute("viewBox","0 0 12 10");
    checkSvg.setAttribute("fill","none");
    var checkPath = document.createElementNS("http://www.w3.org/2000/svg","path");
    checkPath.setAttribute("d","M1 5L4.5 8.5L11 1.5");
    checkPath.setAttribute("stroke","#1c1713");
    checkPath.setAttribute("stroke-width","1.8");
    checkPath.setAttribute("stroke-linecap","round");
    checkPath.setAttribute("stroke-linejoin","round");
    checkSvg.appendChild(checkPath);
    check.appendChild(checkSvg);

    opt.appendChild(pin);
    opt.appendChild(info);
    opt.appendChild(check);

    opt.addEventListener("click", function(){
      branchList.querySelectorAll(".branch-option").forEach(function(o){
        o.classList.remove("selected");
      });
      opt.classList.add("selected");
      selectedBranch = b.name + " (" + b.sub + ")";
      branchConfirmBtn.classList.add("ready");
    });

    branchList.appendChild(opt);
  });

  function openBranchModal(){
    selectedBranch = null;
    branchConfirmBtn.classList.remove("ready");
    branchList.querySelectorAll(".branch-option").forEach(function(o){
      o.classList.remove("selected");
    });
    branchOverlay.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeBranchModal(){
    branchOverlay.classList.remove("open");
    document.body.style.overflow = "";
  }
  window.closeBranchModal = closeBranchModal;

  branchOverlay.addEventListener("click", function(e){
    if (e.target === branchOverlay) closeBranchModal();
  });

  function requestOrder(){
    var totals = cartTotals();
    if (totals.count === 0) return;
    openBranchModal();
  }
  window.requestOrder = requestOrder;

  function confirmBranch(){
    if (!selectedBranch) return;
    closeBranchModal();
    sendOrder(selectedBranch);
  }
  window.confirmBranch = confirmBranch;

  /* =========================================================
     INIT
  ========================================================= */
  // Каждый блок инициализации изолирован: если один из них упадёт с
  // ошибкой (например, из-за неожиданных query-параметров карты
  // лояльности), это не должно "заморозить" всё приложение — меню и
  // корзина обязаны остаться рабочими в любом случае.
  try { renderLoyalty(); } catch (e) { console.error("renderLoyalty failed:", e); }
  try { renderCategories(); } catch (e) { console.error("renderCategories failed:", e); }
  try { updateCartUI(); } catch (e) { console.error("updateCartUI failed:", e); }

  if (tg){
    try {
      tg.setHeaderColor && tg.setHeaderColor("#0f0c0a");
      tg.setBackgroundColor && tg.setBackgroundColor("#0f0c0a");
    } catch(e) {}
  }

})();
</script>
</body>
</html>
