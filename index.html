  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 700px 420px at 15% -8%, rgba(230,184,125,0.10), transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 0%, rgba(201,148,86,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit;}
  a{color:inherit;}

  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px;}

  /* HEADER */
  .brand{
    display:flex;align-items:center;gap:12px;
    padding:6px 2px 18px;
  }
  .brand-mark{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(155deg,var(--gold) 0%,var(--gold-deep) 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;flex:0 0 auto;
    box-shadow:0 6px 16px rgba(201,148,86,0.35);
  }
  .brand-text h1{font-size:19px;margin:0;line-height:1.15;color:var(--text);}
  .brand-text p{margin:2px 0 0;font-size:12px;color:var(--text-muted);letter-spacing:0.04em;text-transform:uppercase;}

  /* LOYALTY CARD - signature element */
  .loyalty{
    position:relative;
    border-radius:22px;
    padding:20px 18px 18px;
    background:
      repeating-linear-gradient(115deg, rgba(230,184,125,0.05) 0px, rgba(230,184,125,0.05) 1px, transparent 1px, transparent 14px),
      linear-gradient(160deg,#221b15 0%, #150f0b 100%);
    border:1px solid var(--line);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
    overflow:hidden;
    margin-bottom:22px;
  }
  .loyalty::before{
    content:"";
    position:absolute; top:-40px; right:-40px;
    width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle, rgba(230,184,125,0.18), transparent 70%);
  }
  .loyalty-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .loyalty-title{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold);font-weight:700;}
  .loyalty-sub{font-size:12.5px;color:var(--text-muted);margin-top:4px;max-width:230px;line-height:1.4;}
  .loyalty-count{font-family:'Fraunces',serif;font-size:26px;color:var(--gold);font-weight:600;text-align:right;}
  .loyalty-count span{font-size:13px;color:var(--text-muted);font-family:'Manrope',sans-serif;}

  .stamps{display:flex;gap:9px;margin-top:16px;position:relative;z-index:1;}
  .stamp{
    flex:1;
    aspect-ratio:1/1;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    border:1.5px dashed rgba(230,184,125,0.35);
    background:rgba(255,255,255,0.02);
    color:transparent;
    transition:transform .25s ease;
  }
  .stamp.filled{
    border:1.5px solid var(--gold);
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    color:#1c1713;
    box-shadow:0 4px 10px rgba(201,148,86,0.4);
  }
  .loyalty-note{
    margin-top:14px;font-size:12px;color:var(--text-muted);position:relative;z-index:1;
  }
  .loyalty-note b{color:var(--gold);font-weight:700;}

  .free-drink-badge{
    margin: 0 0 18px;
    padding: 12px 16px;
    border-radius: 14px;
    background: linear-gradient(155deg, var(--gold) 0%, var(--gold-deep) 100%);
    color: #1c1713;
    font-weight: 700;
    font-size: 13.5px;
    text-align: center;
    box-shadow: 0 6px 16px rgba(201,148,86,0.35);
  }

  /* CATEGORY GRID */
  .section-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.12em;
    color:var(--text-muted);font-weight:700;margin:0 0 10px 2px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .cat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:0;
    display:flex;flex-direction:column;
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    text-align:left;
  }
  .cat-card:active{transform:scale(0.97);background:var(--surface-2);}
  .cat-media{
    position:relative;
    width:100%;height:104px;
    background:radial-gradient(circle at 35% 28%, #2a2119 0%, #150f0b 72%);
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .cat-media img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;
  }
  .cat-media-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,12,10,0) 38%, rgba(28,23,19,0.92) 100%);
  }
  .cat-media .cat-badge-icon svg{width:32px;height:32px;position:relative;z-index:1;}
  .cat-body{padding:12px 14px 14px;}
  .cat-icon{font-size:26px;}
  .cat-name{font-size:13.5px;font-weight:700;line-height:1.25;color:var(--text);}
  .cat-count{font-size:11px;color:var(--text-muted);margin-top:4px;}

  /* CATEGORY / DRINK VIEW */
  .view{display:none;}
  .view.active{display:block;}
  .cat-header{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
  }
  .back-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--gold);font-size:13px;font-weight:700;
    padding:9px 14px;border-radius:12px;cursor:pointer;
  }
  .back-btn:active{background:var(--surface-2);}
  .cat-header h2{font-size:18px;margin:0;color:var(--text);}

  .drink-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .drink-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .drink-name{font-size:15.5px;font-weight:700;color:var(--text);line-height:1.3;}
  .drink-price{
    font-family:'Fraunces',serif;font-size:17px;color:var(--gold);white-space:nowrap;font-weight:600;
  }

  .vol-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .vol-btn{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text-muted);
    font-size:13px;font-weight:700;
    padding:8px 14px;border-radius:10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .vol-btn.active{
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    border-color:var(--gold);
    color:#1c1713;
  }

  .addon-select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;
    padding:11px 12px;
    border-radius:10px;
    margin-bottom:12px;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1L7 7L13 1' stroke='%23e6b87d' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    padding-right:32px;
  }
  .addon-select:focus, .vol-btn:focus-visible, .back-btn:focus-visible, .cat-card:focus-visible, .add-btn:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  .add-btn{
    width:100%;
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold);
    font-size:13.5px;font-weight:800;
    padding:11px;border-radius:12px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:background .15s ease, color .15s ease;
  }
  .add-btn:active{background:var(--gold);color:#1c1713;}
  .add-btn.just-added{background:var(--gold);color:#1c1713;}

  /* TOAST */
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);
    background:var(--surface-3);border:1px solid var(--line);
    color:var(--text);font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:30px;
    box-shadow:var(--shadow);
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* FALLBACK CART BAR (used outside Telegram, or as visual echo) */
  .cart-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg, rgba(15,12,10,0) 0%, rgba(15,12,10,0.97) 22%, #0f0c0a 100%);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    display:none;
    z-index:40;
  }
  .cart-bar.show{display:block;}
  .cart-bar-inner{
    max-width:560px;margin:0 auto;
    background:linear-gradient(155deg,var(--gold) 0%, var(--gold-deep) 100%);
    color:#1c1713;
    border-radius:16px;
    padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;
    font-weight:800;font-size:14.5px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(201,148,86,0.35);
  }

  .empty-state{
    text-align:center;color:var(--text-muted);font-size:13px;padding:30px 10px;
  }

  /* HERO BACKGROUND (logo photo, blurred, main-menu backdrop) */
  .hero-bg{
    position:fixed;inset:0;
    background-image:var(--hero-image);
    background-size:cover;
    background-position:center 18%;
    filter:blur(26px) saturate(1.08) brightness(0.55);
    transform:scale(1.18);
    z-index:-2;
  }
  .hero-overlay{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 520px 380px at 50% -4%, rgba(230,184,125,0.14), transparent 62%),
      linear-gradient(180deg, rgba(15,12,10,0.30) 0%, rgba(15,12,10,0.72) 42%, var(--bg) 76%);
    z-index:-1;
  }

  /* BRAND AVATAR (uploaded logo thumbnail) */
  .brand-avatar{
    width:50px;height:50px;border-radius:50%;
    object-fit:cover;flex:0 0 auto;
    border:1.5px solid var(--gold);
    box-shadow:0 6px 16px rgba(201,148,86,0.35), 0 0 0 4px rgba(230,184,125,0.07);
  }

  /* DRINK-VIEW HEADER BADGE (icon or photo thumbnail) */
  .drink-badge{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:radial-gradient(circle at 35% 28%, #2a2119 0%, #150f0b 72%);
    border:1px solid rgba(230,184,125,0.4);
    overflow:hidden;
  }
  .drink-badge svg{width:18px;height:18px;}
  .drink-badge img{width:100%;height:100%;object-fit:cover;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="hero-bg" id="heroBg"></div>
<div class="hero-overlay"></div>

<div class="wrap">

  <div class="brand">
    <img class="brand-avatar" id="brandAvatar" alt="Americano Coffee & Food Truck">
    <div class="brand-text">
      <h1>Americano Special Bar</h1>
      <p>Кофе • Чай • Бары</p>
    </div>
  </div>

  <div class="loyalty" id="loyaltyCard">
    <div class="loyalty-top">
      <div>
        <div class="loyalty-title">Карта лояльности</div>
        <div class="loyalty-sub" id="loyaltySub">Собирайте штампы за каждый напиток</div>
      </div>
      <div class="loyalty-count" id="loyaltyCount">0<span>/6</span></div>
    </div>
    <div class="stamps" id="stampsRow"></div>
    <div class="loyalty-note" id="loyaltyNote"></div>
  </div>

  <div class="free-drink-badge" id="freeDrinkBadge" style="display:none;"></div>

  <!-- CATEGORIES VIEW -->
  <div class="view active" id="viewCategories">
    <div class="section-label">Категории меню</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <!-- DRINKS VIEW -->
  <div class="view" id="viewDrinks">
    <div class="cat-header">
      <button class="back-btn" type="button" id="backBtn" onclick="goToCategories()">← К категориям</button>
      <h2 id="drinksTitle"></h2>
    </div>
    <div id="drinksList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="cart-bar" id="cartBar">
  <div class="cart-bar-inner" id="cartBarInner" onclick="sendOrder()">
    <span id="cartBarText">Заказать (0) • 0 сум</span>
    <span>→</span>

</div>

  /* =========================================================

  ========================================================= */
  function fmt(n){
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function getUrlStamps(){
    var params = new URLSearchParams(window.location.search);
    var raw = parseInt(params.get("stamps"), 10);
    if (isNaN(raw)) raw = 0;
    if (raw < 0) raw = 0;
    if (raw > 6) raw = 6;
    return raw;
  }

  function getUrlFree(){
    var params = new URLSearchParams(window.location.search);
    var raw = parseInt(params.get("free"), 10);
    if (isNaN(raw) || raw < 0) raw = 0;
    return raw;
  }

  /* =========================================================
     LOYALTY CARD
  ========================================================= */
  function pluralDrinks(n){
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return "напиток";
    if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return "напитка";
    return "напитков";
  }

  function renderLoyalty(){
    var stamps = getUrlStamps();
    var freeDrinks = getUrlFree();

    var row = document.getElementById("stampsRow");
    row.innerHTML = "";
    for (var i = 0; i < 6; i++){
      var el = document.createElement("div");
      el.className = "stamp" + (i < stamps ? " filled" : "");
      el.textContent = "☕";
      row.appendChild(el);
    }
    document.getElementById("loyaltyCount").innerHTML = stamps + "<span>/6</span>";

    var note = document.getElementById("loyaltyNote");
    if (stamps >= 6){
      note.innerHTML = "<b>Поздравляем!</b> Ещё один штамп — и будет бесплатный напиток 🎉";
    } else {
      var left = 6 - stamps;
      note.innerHTML = "Ещё <b>" + left + "</b> " + pluralDrinks(left) + " до бесплатного угощения ✨";
    }

    var badge = document.getElementById("freeDrinkBadge");
    if (badge){
      if (freeDrinks > 0){
        badge.style.display = "block";
        badge.textContent = freeDrinks > 1
          ? "🎉 У вас " + freeDrinks + " бесплатных напитка(ов)!"
          : "🎉 У вас есть бесплатный напиток!";
      } else {
        badge.style.display = "none";
      }
    }
  }

  ========================================================= */
  function openCategory(catId){
    var cat = CATEGORIES.filter(function(c){ return c.id === catId; })[0];
    if (!cat) return;
    currentCategoryId = catId;

    var headerBadgeInner = CATEGORY_IMAGES[cat.id]
      ? '<img src="' + CATEGORY_IMAGES[cat.id] + '" alt="" style="object-position:' + (CATEGORY_IMAGE_POS[cat.id] || 'center') + ';">'
      : (ICONS[cat.id] || '');

    document.getElementById("drinksTitle").innerHTML =
      '<span class="drink-badge" style="display:inline-flex;vertical-align:middle;margin-right:8px;">' + headerBadgeInner + '</span>' +
      cat.icon + ' ' + cat.name;
    renderDrinks(cat);

    document.getElementById("viewCategories").classList.remove("active");
    document.getElementById("viewDrinks").classList.add("active");
    window.scrollTo(0,0);

    if (tg && tg.BackButton){
      tg.BackButton.show();
      tg.BackButton.onClick(goToCategories);
    }

    currentCategoryId = null;
    document.getElementById("viewDrinks").classList.remove("active");
    document.getElementById("viewCategories").classList.add("active");

  /* =========================================================
     DRINKS LIST + ISOLATED VOLUME / ADDON LOGIC
  ========================================================= */
  function renderDrinks(cat){
    var list = document.getElementById("drinksList");
    list.innerHTML = "";

    cat.drinks.forEach(function(drink, drinkIndex){
      var cardId = cat.id + "-" + drinkIndex;

      var card = document.createElement("div");
      card.className = "drink-card";
      card.setAttribute("data-drink-id", cardId);

      // --- head ---
      var head = document.createElement("div");
      head.className = "drink-head";
      var nameEl = document.createElement("div");
      nameEl.className = "drink-name";
      nameEl.textContent = drink.name;
      var priceEl = document.createElement("div");
      priceEl.className = "drink-price";
      priceEl.textContent = fmt(drink.volumes[0].price) + " сум";
      head.appendChild(nameEl);
      head.appendChild(priceEl);
      card.appendChild(head);

      // --- volume buttons row (isolated per-card) — skipped for single fixed-price drinks ---
      var volRow = null;
      if (!drink.hideVolume){
        volRow = document.createElement("div");
        volRow.className = "vol-row";
        drink.volumes.forEach(function(vol, volIndex){
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "vol-btn" + (volIndex === 0 ? " active" : "");
          btn.textContent = vol.label ? vol.label : (vol.ml + " мл");
          btn.setAttribute("data-price", vol.price);
          volRow.appendChild(btn);
        });
        card.appendChild(volRow);
      }

      // --- addon select ---
      var select = document.createElement("select");
      select.className = "addon-select";
      ADDONS.forEach(function(addon){
        var opt = document.createElement("option");
        opt.value = addon.id;
        opt.textContent = addon.label;
        select.appendChild(opt);
      });
      card.appendChild(select);

      // --- add to cart button ---
      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "add-btn";
      addBtn.innerHTML = "+ Добавить в корзину";
      card.appendChild(addBtn);

      list.appendChild(card);

      /* ---------- ISOLATED EVENT WIRING (scoped strictly to THIS card) ---------- */

      function currentVolBtn(){
        return card.querySelector(".vol-btn.active");
      }

      function currentAddon(){
        var val = select.value;
        return ADDONS.filter(function(a){ return a.id === val; })[0] || ADDONS[0];
      }

      function recalcPrice(){
        var volBtn = currentVolBtn();
        var basePrice = volBtn ? parseInt(volBtn.getAttribute("data-price"), 10) : drink.volumes[0].price;
        var addon = currentAddon();
        var total = basePrice + addon.price;
        priceEl.textContent = fmt(total) + " сум";
        return total;
      }

      // Volume buttons: toggle active strictly within THIS card's vol-row
      if (volRow){
        var volButtons = volRow.querySelectorAll(".vol-btn");
        volButtons.forEach(function(btn){
          btn.addEventListener("click", function(){
            volRow.querySelectorAll(".vol-btn").forEach(function(b){
              b.classList.remove("active");
            });
            btn.classList.add("active");
            recalcPrice();
          });
        });
      }

      // Addon select: recalc on change, scoped to this card
      select.addEventListener("change", function(){
        recalcPrice();
      });

      // Add to cart
      addBtn.addEventListener("click", function(){
        var volBtn = currentVolBtn();
        var sizeLabel = volBtn ? volBtn.textContent.trim() : (drink.volumes[0].label || (drink.volumes[0].ml + " мл"));
        var addon = currentAddon();
        var total = recalcPrice();

        var itemName = drink.name + (addon.id ? " (" + addon.label.replace(/\s*\(\+5k\)/,"") + ")" : "");
        var size = sizeLabel;
        var key = cardId + "|" + sizeLabel + "|" + addon.id;

        var existing = cart.filter(function(i){ return i.key === key; })[0];
        if (existing){
          existing.qty += 1;
        } else {
          cart.push({
            key: key,
            name: itemName,
            size: size,
            price: total,
            qty: 1
          });
        }

        showToast(drink.name + " добавлен в корзину");
        addBtn.classList.add("just-added");
        addBtn.textContent = "✓ Добавлено";
        setTimeout(function(){
          addBtn.classList.remove("just-added");
          addBtn.innerHTML = "+ Добавить в корзину";
        }, 900);

        updateCartUI();
      });

      // init price
      recalcPrice();
    });
  }

  /* =========================================================
     TOAST
  ========================================================= */
  var toastTimer = null;
  function showToast(msg){
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toast.classList.remove("show");
    }, 1600);
  }

  /* =========================================================
     CART / TELEGRAM MAIN BUTTON
  ========================================================= */
  function cartTotals(){
    var count = 0, sum = 0;
    cart.forEach(function(i){
      count += i.qty;
      sum += i.price * i.qty;
    });
    return { count: count, sum: sum };
  }

  function updateCartUI(){
    var totals = cartTotals();
    var text = "Заказать (" + totals.count + ") • " + fmt(totals.sum) + " сум";

    if (tg && tg.MainButton){
      tg.MainButton.setText(text);
      if (totals.count > 0){
        tg.MainButton.show();
      } else {
        tg.MainButton.hide();
      }
      tg.MainButton.offClick(sendOrder);
      tg.MainButton.onClick(sendOrder);
    }

    // Fallback bottom bar for browsers without Telegram WebApp
    var bar = document.getElementById("cartBar");
    var barText = document.getElementById("cartBarText");
    barText.textContent = text;
    if (!tg && totals.count > 0){
      bar.classList.add("show");
    } else {
      bar.classList.remove("show");
    }
  }

  function sendOrder(){
    var totals = cartTotals();
    if (totals.count === 0) return;

    var payload = {
      type: "order",
      cart: cart.map(function(i){
        return { name: i.name, size: i.size, price: i.price, qty: i.qty };
      }),
      total_price: totals.sum
    };

    if (tg && tg.sendData){
      tg.sendData(JSON.stringify(payload));
    } else {
      showToast("Заказ отправлен (демо-режим)");
      console.log("order payload", payload);
    }
  }
  window.sendOrder = sendOrder;

  /* =========================================================
     INIT
  ========================================================= */
  renderLoyalty();
  renderCategories();
  updateCartUI();
